<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alter</title>
<style>
  /* police hébergée ici (pas chez Google) : aucune donnée de visiteur envoyée à un tiers (RGPD) */
  @font-face{font-family:'Inter'; font-weight:400; font-style:normal; font-display:swap; src:url('fonts/inter-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter'; font-weight:500; font-style:normal; font-display:swap; src:url('fonts/inter-latin-500-normal.woff2') format('woff2');}
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --grey:#8a8a8a;
    --line:#e4e4e4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:40px 40px 20px;
    /* fixe (hors du flux) : quand il rétrécit au défilement, la page ne bouge
       pas. En sticky, la page raccourcissait, le navigateur remontait le
       défilement sous le seuil et le logo sautait en boucle. */
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:var(--bg);
    z-index:100;
    transition:padding 0.25s ease;
  }
  /* place réservée = hauteur de l'en-tête déplié (logo 3660×1114 px) */
  body{padding-top:calc(60px + min(380px, 65vw) / 3.2855);}
  header.compact{
    padding:14px 40px;
  }
  .logo{
    height:auto;
    width:380px;
    max-width:65vw;
    display:block;
    cursor:pointer;
    transition:width 0.25s ease;
  }
  header.compact .logo{
    width:110px;
  }
  .logo-link{display:block;}

  /* ---------- intro ---------- */
  .intro{
    padding:64px 40px 24px;
    max-width:560px;
  }
  .intro p{
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
    margin:0;
  }

  /* ---------- grid ---------- */
  main{
    padding:24px 40px 0;
    position:relative;
    z-index:1;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:64px 40px;
  }
  @media (max-width:720px){
    .grid{grid-template-columns:1fr; gap:48px;}
    header{padding:20px 20px 14px;}
    body{padding-top:calc(34px + 170px / 3.2855);}
    .logo{width:170px;}
    header.compact{padding:10px 20px;}
    header.compact .logo{width:80px;}
    main, footer{padding-left:20px; padding-right:20px;}
    .bio-header{flex-direction:column; align-items:flex-start; gap:28px;}
    .bio-contact p{font-size:15px;}
    .bio-contact p.row, .bio-contact p.addr{max-width:100%;}
  }
  figure{
    margin:0;
    cursor:pointer;
  }
  figure .frame{
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#f4f4f4;
  }
  figure img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:opacity 0.2s ease;
  }
  figure:hover img{opacity:0.85;}
  figcaption{
    margin-top:14px;
  }
  figcaption .name{
    font-size:14px;
    margin:0 0 3px;
  }
  figcaption .mat{
    font-size:12px;
    color:var(--grey);
    margin:0;
  }

  /* ---------- footer : mentions légales seulement (le reste est sur le site principal) ---------- */
  footer{
    margin-top:120px;
    padding:0 40px 48px;
    font-size:13px;
    line-height:1.6;
  }
  footer p{margin:0;}
  footer .muted{color:var(--grey);}
  footer a:hover{color:var(--grey);}
  @media (max-width:720px){
    footer{margin-top:80px; padding-left:20px; padding-right:20px;}
  }

  /* ---------- lightbox ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.98);
    display:none;
    z-index:200;
    overflow-y:auto;
  }
  .overlay.open{display:block;}
  .overlay-inner{
    max-width:1000px;
    margin:0 auto;
    padding:40px 40px 80px;
  }
  @media (max-width:720px){
    .overlay-inner{padding:20px 16px 50px;}
    .lb-thumbs img{width:56px; height:56px;}
    .lb-text h2{font-size:16px;}
  }
  .overlay .close{
    position:sticky;
    top:0;
    display:flex;
    justify-content:flex-end;
    background:var(--bg);
    padding:8px 0 20px;
  }
  .overlay .close button{
    background:none;
    border:none;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    font-family:inherit;
  }
  .lb-main{
    width:100%;
    aspect-ratio:4/3;
    background:#f4f4f4;
    overflow:hidden;
    margin-bottom:14px;
  }
  .lb-main img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .lb-thumbs{
    display:flex;
    gap:10px;
    margin-bottom:36px;
    flex-wrap:wrap;
  }
  .lb-thumbs img{
    width:70px;
    height:70px;
    object-fit:cover;
    cursor:pointer;
    opacity:0.55;
  }
  .lb-thumbs img.active{opacity:1;}
  .lb-text{
    max-width:560px;
  }
  .lb-text h2{
    font-size:18px;
    font-weight:normal;
    margin:0 0 8px;
  }
  .lb-text .mat{
    font-size:13px;
    color:var(--grey);
    margin:0 0 20px;
  }
  .lb-text .mat:has(+ .mat){margin-bottom:4px;}
  .lb-text .desc{
    font-size:14px;
    line-height:1.65;
    margin:0;
  }
  .bio-header{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:56px;
    margin-top:16px;
  }
  .bio-contact p{
    margin:0 0 14px;
    font-size:18px;
    line-height:1.6;
  }
  .bio-contact p.addr{
    max-width:320px;
  }
  .bio-contact p.row{
    display:flex;
    justify-content:space-between;
    gap:24px;
    max-width:360px;
  }
  .enquire{
    display:block;
    margin-top:16px;
    font-size:13px;
  }
  .enquire:first-of-type{margin-top:28px;}
  .enquire:hover{color:var(--grey);}
</style>
</head>
<body>

<header>
  <a class="logo-link" href="https://alteralteralter.com" aria-label="alter – site"><img id="logoBtn" class="logo" src="images/logo.png" alt="alter"></a>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <p><a href="mailto:admin@alteralteralter.com">Contact</a></p>
  <p><a href="legal.html">Legal notice &amp; privacy</a></p>
  <p class="muted">&copy; <span id="year"></span> alter &middot; No cookies</p>
</footer>

<div class="overlay" id="overlay">
  <div class="overlay-inner" id="overlayInner"></div>
</div>

<script>
const items = [
  {
    name:"La Marmite Mobile",
    hire:true,
    mat:"Second-hand trailer, blue HPL, reused Betonplex, stainless steel",
    year:"2025",
    dims:"",
    instagram:"https://www.instagram.com/p/DaIH4OIiFGe/",
    desc:"Mobile kitchen on a compact trailer: fold-out stainless steel worktop, sink, stove, built-in storage and a large blue umbrella.",
    images:["images/marmite-mobile-1.jpg","images/marmite-mobile-2.jpg"]
  },
  {
    name:"Bank DayBed",
    mat:"Reclaimed curved wood, repurposed metal lockers",
    year:"2026",
    dims:"",
    instagram:"https://www.instagram.com/p/DXJnI9piI_m/",
    desc:"Bench or daybed, mechanically assembled with minimal cutting and fully dismountable. Two units join into one large daybed.",
    images:["images/bank-daybed-1.jpg","images/bank-daybed-2.jpg","images/bank-daybed-3.jpg","images/bank-daybed-4.jpg","images/bank-daybed-5.jpg","images/bank-daybed-6.jpg","images/bank-daybed-7.jpg"]
  },
  {
    name:"Opus Incertum shelf",
    mat:"Reused Bito shelving, marble offcuts, rubble, plaster",
    year:"2025",
    dims:"",
    instagram:"https://www.instagram.com/p/DLktIvtIaNl/",
    desc:"Shelving frame topped with an opus incertum and terrazzo surface cast from construction waste.",
    images:["images/opus-incertum-shelf-1.jpg","images/opus-incertum-shelf-2.jpg","images/opus-incertum-shelf-3.jpg","images/opus-incertum-shelf-4.jpg"]
  },
  {
    name:"CCN Slab Big Tables",
    mat:"Reclaimed terrazzo slabs, reclaimed concrete blocks, tension straps",
    year:"2025",
    dims:"Tops in 120 \u00d7 60 cm slabs",
    instagram:"https://www.instagram.com/p/DW3gv6eiFxb/",
    desc:"Two long tables, one high and one low with steps. Held together by gravity, stacking and straps: no glue, no screws, fully dismountable.",
    images:["images/ccn-slab-big-tables-1.jpg","images/ccn-slab-big-tables-2.jpg"]
  },
  {
    name:"A wooden column",
    mat:"Corten steel",
    year:"",
    dims:"",
    instagram:"https://www.instagram.com/alteralteralteralter/",
    desc:"Load-bearing column in corten steel for outdoor wooden furniture.",
    images:["images/a-wooden-column-1.jpg"]
  },
  {
    name:"Conversation Pit",
    mat:"Reclaimed ventilation boxes, carpet",
    year:"2026",
    dims:"",
    instagram:"https://www.instagram.com/p/DYxY3gTCLiU/",
    desc:"Sunken seating: ventilation boxes as backrests, the whole structure wrapped in carpet.",
    images:["images/conversation-pit-1.jpg"]
  }
];

const grid = document.getElementById('grid');
items.forEach((item, idx)=>{
  const fig = document.createElement('figure');
  fig.innerHTML = `
    <div class="frame"><img src="${item.images[0]}" alt="${item.name}" loading="lazy"></div>
    <figcaption>
      <p class="name">${item.name}</p>
      <p class="mat">${item.mat}</p>
      ${item.hire ? '<p class="mat">Available for hire</p>' : ''}
    </figcaption>
  `;
  fig.addEventListener('click', ()=>openLightbox(idx));
  grid.appendChild(fig);
});

const overlay = document.getElementById('overlay');
const overlayInner = document.getElementById('overlayInner');

function openLightbox(idx){
  const item = items[idx];
  let currentImg = 0;

  function render(){
    overlayInner.innerHTML = `
      <div class="close"><button id="closeBtn">Close ✕</button></div>
      <div class="lb-main"><img id="lbMain" src="${item.images[currentImg]}" alt="${item.name}"></div>
      ${item.images.length > 1 ? `<div class="lb-thumbs">${item.images.map((src,i)=>`<img src="${src}" data-i="${i}" class="${i===currentImg?'active':''}">`).join('')}</div>` : '<div style="margin-bottom:36px;"></div>'}
      <div class="lb-text">
        <h2>${item.name}</h2>
        <p class="mat">${item.mat}</p>
        ${(item.dims || item.year) ? `<p class="mat">${[item.dims, item.year].filter(Boolean).join(' · ')}</p>` : ''}
        <p class="desc">${item.desc}</p>
        ${item.hire
          ? `<a class="enquire" href="mailto:admin@alteralteralter.com?subject=${encodeURIComponent('Booking — ' + item.name)}">Book →</a>`
          : `<a class="enquire" href="mailto:admin@alteralteralter.com?subject=${encodeURIComponent('Enquiry — ' + item.name)}">Enquire →</a>`}
        <a class="enquire" href="${item.instagram}" target="_blank" rel="noopener">View on Instagram →</a>
      </div>
    `;
    document.getElementById('closeBtn').addEventListener('click', closeLightbox);
    overlayInner.querySelectorAll('.lb-thumbs img').forEach(t=>{
      t.addEventListener('click', ()=>{ currentImg = parseInt(t.dataset.i); render(); });
    });
  }
  render();
  overlay.classList.add('open');
  overlay.scrollTop = 0;
}
document.getElementById('year').textContent = new Date().getFullYear();

const siteHeader = document.querySelector('header');
function onScroll(){
  // seuils différents à l'aller et au retour : pas d'aller-retour autour d'une valeur
  if (window.scrollY > 60) { siteHeader.classList.add('compact'); }
  else if (window.scrollY < 20) { siteHeader.classList.remove('compact'); }
}
window.addEventListener('scroll', onScroll, {passive:true});
onScroll();

function closeLightbox(){ overlay.classList.remove('open'); }
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
